<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0000">
<title>EVOREZ</title>
<meta name="description" content="EVOREZ">
<meta property="og:url" content="https://evorez.in">
<meta property="og:image" content="https://evorez.in/assets/profile.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22none%22 stroke=%22%23ff1a2b%22 stroke-width=%2210%22/><text x=%2250%22 y=%2268%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22%23ff1a2b%22 font-weight=%22800%22>E</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;
    background: linear-gradient(180deg, #7a0010 0%, #1a0002 35%, #000000 100%);
    color:#fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
  }
  .avatar{
    width:56px;
    height:56px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.15);
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    flex-shrink:0;
  }
  .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .name span{
    font-weight:400;
    opacity:.9;
  }
  .center{
    min-height: calc(100vh - 88px);
    display:grid;
    place-items:center;
    text-align:center;
    padding:24px;
  }
  .center h1{font-size:44px; font-weight:900; letter-spacing:-.03em}
  .center p{margin-top:10px; color:rgba(255,255,255,.65); font-size:14px}
</style>
</head>
<body>
  <header class="topbar">
    <img src="assets/profile.png" alt="Evorez profile" class="avatar">
    <div class="name">𝙴𝚟𝚘𝚛𝚎𝚣 <span>🪽</span></div>
  </header>

  <main class="center">
    <div>
      <h1>EVOREZ</h1>
      <p>evorez.in</p>
    </div>
  </main>
</body>
</html>
