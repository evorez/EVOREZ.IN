<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0000">
<title>EVOREZ</title>
<meta name="description" content="EVOREZ — If you're watching this I'm alive. Building stuffs soon stay connected.">
<meta property="og:title" content="EVOREZ">
<meta property="og:description" content="If you're watching this I'm alive — building stuffs soon, stay connected.">
<meta property="og:url" content="https://evorez.in">
<meta property="og:image" content="https://evorez.in/assets/profile.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22none%22 stroke=%22%23ff1a2b%22 stroke-width=%2210%22/><text x=%2250%22 y=%2268%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22%23ff1a2b%22 font-weight=%22800%22>E</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  /* water-like waveform + fixed gradient */
  .wave-bg{
    position:fixed; inset:0; z-index:-1;
    background:#000;
    overflow:hidden;
  }
  .wave-bg svg{
    position:absolute; inset:0; width:100%; height:100%;
    display:block;
  }
  /* depth vignette + bottom fade for water feel */
  .wave-bg::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 130% 85% at 50% 50%, transparent 56%, rgba(0,0,0,.38) 90%),
      linear-gradient(180deg, rgba(0,0,0,.10) 0%, transparent 22%, rgba(0,0,0,.22) 92%),
      radial-gradient(ellipse 70% 50% at 18% 50%, rgba(255,20,40,.06), transparent 58%);
    pointer-events:none;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    position:relative;
    z-index:2;
  }
  .avatar{
    width:56px;
    height:56px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.18);
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    flex-shrink:0;
  }
  .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:center;
    gap:8px;
    text-shadow: 0 1px 10px rgba(0,0,0,.5);
  }
  .wrap{
    min-height: calc(100vh - 88px);
    display:grid;
    place-items:center;
    padding:24px 16px 40px;
    position:relative; z-index:1;
  }
  .stack{width:100%; max-width:560px; text-align:center}
  .title{font-size:44px; font-weight:900; letter-spacing:-.03em; text-shadow: 0 2px 20px rgba(0,0,0,.6)}
  .subtitle{margin-top:6px; color:rgba(255,255,255,.7); font-size:14px; letter-spacing:.02em}
  .card{
    margin:24px auto 0;
    width:100%;
    max-width:560px;
    padding:22px 20px;
    border-radius:20px;
    background: rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
    text-align:center;
  }
  .card p{font-size:15px; line-height:1.6; font-weight:500; color: rgba(255,255,255,.92)}
  .dot{width:8px; height:8px; border-radius:50%; background:#00ff88; display:inline-block; margin-right:8px; box-shadow: 0 0 10px rgba(0,255,136,.8); vertical-align:middle}
  .hint{margin-top:12px; font-size:12px; color:rgba(255,255,255,.6)}
  @media (prefers-reduced-motion: reduce){
    .wave-bg svg path animate{ display:none }
  }
</style>
</head>
<body>
  <!-- Water-like waves: 4 liquid layers + fixed canvas gradient -->
  <div class="wave-bg" aria-hidden="true">
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- FIXED canvas gradient — bright → dimmest → dark, no hard banding -->
        <linearGradient id="redFade" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ff3140"/>
          <stop offset="12%" stop-color="#ea0a1e"/>
          <stop offset="22%" stop-color="#c30016"/>
          <stop offset="34%" stop-color="#9d0012"/>
          <stop offset="48%" stop-color="#6e0010"/>
          <stop offset="62%" stop-color="#3d000c"/>
          <stop offset="78%" stop-color="#140006"/>
          <stop offset="88%" stop-color="#060001"/>
          <stop offset="100%" stop-color="#000000"/>
        </linearGradient>
        <!-- second softer fill for depth (more transparent) -->
        <linearGradient id="redDeep" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#b00014" stop-opacity="0.55"/>
          <stop offset="30%" stop-color="#7a0010" stop-opacity="0.38"/>
          <stop offset="60%" stop-color="#2a0007" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </linearGradient>
        <!-- glow stroke gradient -->
        <linearGradient id="glowFade" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="rgba(255,40,58,0.20)"/>
          <stop offset="28%" stop-color="rgba(180,0,18,0.16)"/>
          <stop offset="55%" stop-color="rgba(90,0,10,0.09)"/>
          <stop offset="82%" stop-color="rgba(30,0,6,0.04)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </linearGradient>
        <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="13"/></filter>
        <filter id="softBlur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="18"/></filter>
        <filter id="softBlur3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceGraphic" stdDeviation="9"/></filter>
      </defs>
      <rect width="1000" height="1000" fill="#000"/>

      <!-- Layer 1 — main water body (liquid morph, 7.5s) -->
      <path fill="url(#redFade)" opacity="0.98">
        <animate attributeName="d" dur="7.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.33;0.66;1"
          values="
            M0 0 L 432 0 C 560 108, 318 192, 522 312 C 682 428, 308 528, 562 648 C 682 748, 338 832, 582 918 C 652 972, 418 1000, 476 1000 L0 1000 Z;
            M0 0 L 508 0 C 638 126, 382 212, 598 332 C 752 452, 352 552, 636 670 C 742 768, 382 852, 658 934 C 702 976, 362 1000, 402 1000 L0 1000 Z;
            M0 0 L 384 0 C 502 102, 282 182, 478 302 C 622 418, 272 518, 506 638 C 618 738, 302 822, 542 910 C 588 962, 376 1000, 442 1000 L0 1000 Z;
            M0 0 L 432 0 C 560 108, 318 192, 522 312 C 682 428, 308 528, 562 648 C 682 748, 338 832, 582 918 C 652 972, 418 1000, 476 1000 L0 1000 Z
          "/>
      </path>

      <!-- Layer 2 — second water sheet offset 38px for parallax (9.2s, opposite phase) -->
      <path fill="url(#redDeep)" opacity="1">
        <animate attributeName="d" dur="9.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.33;0.66;1"
          values="
            M0 0 L 468 0 C 592 118, 354 202, 558 322 C 718 442, 344 542, 598 662 C 714 762, 372 846, 618 932 C 682 980, 452 1000, 512 1000 L0 1000 Z;
            M0 0 L 542 0 C 668 138, 418 226, 632 346 C 786 466, 386 566, 672 684 C 774 784, 416 864, 692 948 C 732 984, 398 1000, 438 1000 L0 1000 Z;
            M0 0 L 412 0 C 534 112, 314 192, 512 314 C 654 432, 306 532, 542 652 C 652 752, 336 836, 574 924 C 618 970, 408 1000, 472 1000 L0 1000 Z;
            M0 0 L 468 0 C 592 118, 354 202, 558 322 C 718 442, 344 542, 598 662 C 714 762, 372 846, 618 932 C 682 980, 452 1000, 512 1000 L0 1000 Z
          "/>
      </path>

      <!-- Layer 3 — glow edge like water surface light scatter (8.4s) -->
      <path fill="none" stroke="url(#glowFade)" stroke-width="30" stroke-linecap="round" filter="url(#softBlur)" opacity="0.95">
        <animate attributeName="d" dur="8.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.33;0.66;1"
          values="
            M 432 0 C 560 108, 318 192, 522 312 C 682 428, 308 528, 562 648 C 682 748, 338 832, 582 918 C 652 972, 418 1000, 476 1000;
            M 508 0 C 638 126, 382 212, 598 332 C 752 452, 352 552, 636 670 C 742 768, 382 852, 658 934 C 702 976, 362 1000, 402 1000;
            M 384 0 C 502 102, 282 182, 478 302 C 622 418, 272 518, 506 638 C 618 738, 302 822, 542 910 C 588 962, 376 1000, 442 1000;
            M 432 0 C 560 108, 318 192, 522 312 C 682 428, 308 528, 562 648 C 682 748, 338 832, 582 918 C 652 972, 418 1000, 476 1000
          "/>
      </path>

      <!-- Layer 4 — second faint glow deeper (10s, very slow) -->
      <path fill="none" stroke="rgba(255,34,50,0.10)" stroke-width="42" stroke-linecap="round" filter="url(#softBlur2)" opacity="0.5">
        <animate attributeName="d" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.33;0.66;1"
          values="
            M 468 0 C 592 118, 354 202, 558 322 C 718 442, 344 542, 598 662 C 714 762, 372 846, 618 932;
            M 542 0 C 668 138, 418 226, 632 346 C 786 466, 386 566, 672 684 C 774 784, 416 864, 692 948;
            M 412 0 C 534 112, 314 192, 512 314 C 654 432, 306 532, 542 652 C 652 752, 336 836, 574 924;
            M 468 0 C 592 118, 354 202, 558 322 C 718 442, 344 542, 598 662 C 714 762, 372 846, 618 932
          "/>
      </path>

      <!-- Layer 5 — water crest highlight (thin shimmer, 6s fastest) -->
      <path fill="none" stroke="rgba(255,255,255,0.072)" stroke-width="1.45" stroke-linecap="round">
        <animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.33;0.66;1"
          values="
            M 432 0 C 518 116, 332 206, 498 328 C 598 444, 352 548, 548 664 C 624 756, 368 840, 566 1000;
            M 508 0 C 598 132, 396 224, 574 348 C 674 462, 394 568, 622 682 C 698 774, 412 858, 642 1000;
            M 384 0 C 472 108, 296 194, 452 318 C 542 432, 316 536, 492 654 C 568 746, 332 830, 526 1000;
            M 432 0 C 518 116, 332 206, 498 328 C 598 444, 352 548, 548 664 C 624 756, 368 840, 566 1000
          "/>
      </path>

      <!-- Layer 6 — second highlight subtle (7.1s) -->
      <path fill="none" stroke="rgba(255,220,225,0.045)" stroke-width="1" stroke-linecap="round" filter="url(#softBlur3)" opacity="0.9">
        <animate attributeName="d" dur="7.1s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" keyTimes="0;0.33;0.66;1"
          values="
            M 468 0 C 556 126, 368 218, 534 338 C 632 454, 386 562, 584 678 C 658 770, 402 852, 602 1000;
            M 542 0 C 632 144, 432 238, 608 358 C 706 474, 428 578, 656 696 C 732 788, 448 868, 678 1000;
            M 412 0 C 500 116, 328 206, 488 328 C 578 444, 350 550, 528 668 C 602 760, 366 842, 562 1000;
            M 468 0 C 556 126, 368 218, 534 338 C 632 454, 386 562, 584 678 C 658 770, 402 852, 602 1000
          "/>
      </path>
    </svg>
  </div>

  <header class="topbar">
    <img src="assets/profile.png" alt="Evorez profile" class="avatar">
    <div class="name">𝙴𝚟𝚘𝚛𝚎𝚣 <span>🪽</span></div>
  </header>

  <main class="wrap">
    <div class="stack">
      <h1 class="title">EVOREZ</h1>
      <p class="subtitle">evorez.in</p>
      <div class="card">
        <p><span class="dot"></span>If you're watching this I'm alive</p>
        <p style="margin-top:8px">Building stuffs soon — stay connected.</p>
        <div class="hint">more drops soon • stay tuned</div>
      </div>
    </div>
  </main>
</body>
</html>
