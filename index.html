<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0000">
<title>EVOREZ</title>
<meta name="description" content="EVOREZ — If you're watching this I'm alive. Building stuffs soon stay connected.">
<meta property="og:title" content="EVOREZ">
<meta property="og:description" content="If you're watching this I'm alive — building stuffs soon, stay connected.">
<meta property="og:url" content="https://evorez.in">
<meta property="og:image" content="https://evorez.in/assets/profile.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22none%22 stroke=%22%23ff1a2b%22 stroke-width=%2210%22/><text x=%2250%22 y=%2268%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22%23ff1a2b%22 font-weight=%22800%22>E</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;
    background: linear-gradient(180deg, #7a0010 0%, #1a0002 35%, #000000 100%);
    color:#fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
  }
  .avatar{
    width:56px;
    height:56px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid rgba(255,255,255,.15);
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    flex-shrink:0;
  }
  .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.02em;
    display:flex;
    align-items:center;
    gap:8px;
    text-shadow: 0 1px 10px rgba(0,0,0,.5);
  }
  .wrap{
    min-height: calc(100vh - 88px);
    display:grid;
    place-items:center;
    padding:24px 16px 40px;
  }
  .stack{width:100%; max-width:560px; text-align:center}
  .title{font-size:44px; font-weight:900; letter-spacing:-.03em}
  .subtitle{margin-top:6px; color:rgba(255,255,255,.6); font-size:14px; letter-spacing:.02em}
  /* frosted iOS card */
  .card{
    margin:24px auto 0;
    width:100%;
    max-width:560px;
    padding:22px 20px;
    border-radius:20px;
    background: rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    text-align:center;
  }
  .card p{
    font-size:15px;
    line-height:1.6;
    font-weight:500;
    color: rgba(255,255,255,.92);
  }
  .card p span{color:#fff; font-weight:700}
  .card .dot{
    width:8px; height:8px; border-radius:50%; background:#00ff88; display:inline-block; margin-right:8px;
    box-shadow: 0 0 10px rgba(0,255,136,.8);
    vertical-align:middle;
  }
  .hint{margin-top:12px; font-size:12px; color:rgba(255,255,255,.55)}
</style>
</head>
<body>
  <header class="topbar">
    <img src="assets/profile.png" alt="Evorez profile" class="avatar">
    <div class="name">𝙴𝚟𝚘𝚛𝚎𝚣 <span>🪽</span></div>
  </header>

  <main class="wrap">
    <div class="stack">
      <h1 class="title">EVOREZ</h1>
      <p class="subtitle">evorez.in</p>

      <div class="card">
        <p><span class="dot"></span>If you're watching this I'm alive</p>
        <p style="margin-top:8px">Building stuffs soon — stay connected.</p>
        <div class="hint">more drops soon • stay tuned</div>
      </div>
    </div>
  </main>
</body>
</html>
